# Disposable local PostgreSQL only. Never connect this fixture configuration to production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: longhao_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LONGHAO_DEV_DB_PASSWORD:?Set a local disposable database password}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d longhao_test"]
      interval: 5s
      timeout: 5s
      retries: 20

openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 龍好智慧投顧營運平台 — 14 模組完整 API 契約
  version: 1.0.0
  description: 完整範圍平行開發之契約基準。此版本為設計契約與離線mock，尚非生產功能；無MVP縮減。正式上線須14模組、外部adapter與控制完整通過驗收。
servers:
- url: https://ops.example.invalid/api/v1
  description: 正式網域待部署設定；example.invalid不得當真實服務
- url: http://127.0.0.1:8765/api/v1
  description: 離線合約mock；不是營運後端
tags:
- name: M01
  description: 客戶與身分／申辦
- name: M02
  description: 契約與服務權限
- name: M03
  description: KYC與適合度
- name: M04
  description: AML/CFT
- name: M05
  description: Pantheon候選接收
- name: M06
  description: Agora/Servant審查協作
- name: M07
  description: 研究報告與簽章
- name: M08
  description: 簽章後自動發布
- name: M09
  description: LegendFlow與訊息投遞
- name: M10
  description: CRM行銷漏斗與業務
- name: M11
  description: 維護歸屬與公司池
- name: M12
  description: 獎金計算與結算
- name: M13
  description: 線上線下客服
- name: M14
  description: 財會與內控稽核
paths:
